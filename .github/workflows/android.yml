name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify Xposed metadata
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/java_init.list'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'META-INF/xposed/module.prop'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
